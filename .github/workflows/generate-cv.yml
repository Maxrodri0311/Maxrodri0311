name: Generate CV On-Demand

on:
  workflow_dispatch: # Permite trigger manual desde el botón del README

jobs:
  generate-cv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar Playwright y dependencias
        run: |
          python -m pip install --upgrade pip
          pip install playwright jinja2
          playwright install chromium

      - name: Generar PDF
        run: |
          echo "Ejecutando script generador de CV..."
          python generate_cv.py
          
      - name: Subir PDF como Artefacto
        uses: actions/upload-artifact@v3
        with:
          name: Resume_Maximiliano_Rodriguez
          path: "*.pdf"
          retention-days: 5
